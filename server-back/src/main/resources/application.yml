spring:
  application:
    name: dongle-server

  datasource:
    # 팀 공용 Supabase(PostgreSQL)를 기본값으로 사용. .env의 DB_* 값으로 덮어쓸 수 있음
    # (개인 로컬 PostgreSQL로 돌리고 싶으면 .env에 DB_URL 등을 로컬 값으로 지정)
    url: ${DB_URL:CHANGE_ME}
    username: ${DB_USERNAME:CHANGE_ME}
    password: ${DB_PASSWORD:CHANGE_ME}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema.sql(레포 루트)이 기준. 스키마 변경은 데이터/백엔드 파트 사전 협의 후 schema.sql에 반영
    properties:
      hibernate:
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  # 로컬 개발용 기본값. 운영에서는 반드시 .env의 JWT_SECRET으로 덮어쓸 것 (32바이트 이상)
  secret: ${JWT_SECRET:local-only-dev-secret-please-change-32bytes+}
  access-token-expiry-seconds: 3600 # 1시간
  refresh-token-expiry-seconds: 2592000 # 30일

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:CHANGE_ME}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:CHANGE_ME}
  google:
    client-id: ${GOOGLE_CLIENT_ID:CHANGE_ME}
    client-secret: ${GOOGLE_CLIENT_SECRET:CHANGE_ME}
    redirect-uri: ${GOOGLE_REDIRECT_URI:CHANGE_ME}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key-id: ${AWS_ACCESS_KEY_ID:CHANGE_ME}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:CHANGE_ME}
  s3-bucket: ${S3_BUCKET_NAME:CHANGE_ME}

logging:
  level:
    org.hibernate.SQL: debug
