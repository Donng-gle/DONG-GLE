spring:
  application:
    name: dongle-server

  datasource:
    # 팀 공용 Supabase(PostgreSQL)를 기본값으로 사용. .env의 DB_* 값으로 덮어쓸 수 있음
    # (개인 로컬 PostgreSQL로 돌리고 싶으면 .env에 DB_URL 등을 로컬 값으로 지정)
    url: ${DB_URL:CHANGE_ME}
    username: ${DB_USERNAME:CHANGE_ME}
    password: ${DB_PASSWORD:CHANGE_ME}
    hikari:
      # 기본값(10)이면 테스트가 서로 다른 Spring 컨텍스트를 여러 개 띄울 때(@TestConfiguration 등)
      # 컨텍스트별로 별도 풀이 생겨 공용 Supabase 커넥션 풀 한도를 넘기고 일부 컨텍스트가
      # 기동 실패하는 현상이 재현됨. 풀 크기를 낮춰서 여유를 둠
      maximum-pool-size: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema.sql(레포 루트)이 기준. 스키마 변경은 데이터/백엔드 파트 사전 협의 후 schema.sql에 반영
    properties:
      hibernate:
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  # 로컬 개발용 기본값. 운영에서는 반드시 .env의 JWT_SECRET으로 덮어쓸 것 (32바이트 이상)
  secret: ${JWT_SECRET:local-only-dev-secret-please-change-32bytes+}
  access-token-expiry-seconds: 3600 # 1시간
  refresh-token-expiry-seconds: 2592000 # 30일

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:CHANGE_ME}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:CHANGE_ME}
  google:
    client-id: ${GOOGLE_CLIENT_ID:CHANGE_ME}
    client-secret: ${GOOGLE_CLIENT_SECRET:CHANGE_ME}
    redirect-uri: ${GOOGLE_REDIRECT_URI:CHANGE_ME}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key-id: ${AWS_ACCESS_KEY_ID:CHANGE_ME}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:CHANGE_ME}
  s3-bucket: ${S3_BUCKET_NAME:CHANGE_ME}

google:
  # Google Places 사진 프록시(/images/proxy)용. 데이터 파트가 음식점 tel 보완에 쓰는 것과 동일한 키 재사용 가능
  places-api-key: ${GOOGLE_MAPS_API_KEY:CHANGE_ME}

course-optimizer:
  # ai/course_optimizer를 감싼 FastAPI 서비스 주소. 아직 배포 전이라 로컬 기본값(placeholder) —
  # 배포되면 COURSE_OPTIMIZER_BASE_URL로 실제 주소 주입 필요
  base-url: ${COURSE_OPTIMIZER_BASE_URL:http://localhost:8001}

place-recommender:
  # ai/place_recommender를 감싼 FastAPI 서비스(ai/api/app.py) 주소. course-optimizer와 실제로는 같은 서비스지만
  # 우선 별도 키로 분리해둠 — 배포 시 반드시 COURSE_OPTIMIZER_BASE_URL과 같은 값으로 맞출 것
  base-url: ${PLACE_RECOMMENDER_BASE_URL:http://localhost:8001}

logging:
  level:
    org.hibernate.SQL: debug
