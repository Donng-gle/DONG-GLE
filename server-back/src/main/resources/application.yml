spring:
  application:
    name: dongle-server

  datasource:
    url: jdbc:postgresql://localhost:5433/dongle?stringtype=unspecified
    username: seolmansu
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema.sql(레포 루트)이 기준. 스키마 변경은 데이터/백엔드 파트 사전 협의 후 schema.sql에 반영
    properties:
      hibernate:
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE

jwt:
  # 로컬 개발용 기본값. 운영에서는 반드시 .env의 JWT_SECRET으로 덮어쓸 것 (32바이트 이상)
  secret: ${JWT_SECRET:local-only-dev-secret-please-change-32bytes+}
  access-token-expiry-seconds: 3600 # 1시간
  refresh-token-expiry-seconds: 2592000 # 30일

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:CHANGE_ME}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:CHANGE_ME}
  google:
    client-id: ${GOOGLE_CLIENT_ID:CHANGE_ME}
    client-secret: ${GOOGLE_CLIENT_SECRET:CHANGE_ME}
    redirect-uri: ${GOOGLE_REDIRECT_URI:CHANGE_ME}

logging:
  level:
    org.hibernate.SQL: debug
