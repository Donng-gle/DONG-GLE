openapi: 3.0.3
info:
  title: 갈래말래 API
  description: |
    안동 감성 여행 플랫폼 **갈래말래**의 API 명세서입니다.

    ## 인증
    - 소셜 로그인(카카오/구글)으로 JWT 토큰 발급
    - 인증 필요 엔드포인트는 `Authorization: Bearer {access_token}` 헤더 필요
    - 인증이 필요 없는 엔드포인트는 security 항목이 비어있음 (비인증 허용)

    ## 변경 이력
    - v1.3.1: 마이페이지 취향 재분석 기능 추가
      - POST /onboarding/reset — 취향 벡터 초기화 후 온보딩 재시작
    - v1.3.0: 온보딩 알고리즘 확정 및 전면 개편
      - 감성 태그 7개 확정 (relaxing/lively/romantic/local/photogenic/traditional/modern)
      - 온보딩 플로우 재설계: 적응형 카드 선택 알고리즘 반영
        - GET /onboarding/next — 다음 카드 요청 (서버가 알고리즘으로 선택)
        - POST /onboarding/swipe — 좋아요/싫어요 + 벡터 업데이트
        - POST /onboarding/complete — 온보딩 완료 처리
        - GET /onboarding/status — 현재 온보딩 진행 상태 조회
      - user_preference 구조 변경: 태그 점수 기반 벡터로 통일
      - 코스 생성 진입점 2가지 확정 (AI 코스 / 직접 코스)
      - POST /courses/manual — 직접 코스 짜기 추가
    - v1.2.0: 최종 점검 기반 추가 및 보완
    - v1.1.0: 누락 엔드포인트 전체 추가
    - v1.0.0: 최초 설계
  version: 1.3.1

servers:
  - url: https://api.galraemallae.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local Development

tags:
  - name: Auth
    description: 인증 (로그인 / 토큰 갱신 / 로그아웃)
  - name: User
    description: 유저 프로필 / 알림 설정 / FCM 토큰 / 회원 탈퇴
  - name: Onboarding
    description: 온보딩 취향 분석
  - name: Tag
    description: 감성 태그 목록
  - name: Place
    description: 장소 탐색 (목록 / 지도 / 검색 / 상세 / 추천)
  - name: Like
    description: 좋아요
  - name: Swipe
    description: 스와이프 기반 일정짜기
  - name: Course
    description: AI 코스 생성 및 저장된 코스
  - name: VisitLog
    description: 여행 기록
  - name: Explore
    description: 유사 사용자 기록 탐색
  - name: Upload
    description: 파일 업로드 (Presigned URL)
  - name: Image
    description: 외부 이미지 프록시 (Google Places 사진)
  - name: Event
    description: 행사 및 축제 일정
  - name: Admin
    description: 관리자 전용 (데이터 동기화 등)
  - name: System
    description: 헬스체크 및 시스템

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
          example: 인증이 필요합니다.

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
          example: 120
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        has_next:
          type: boolean
          example: true

    OAuthRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 소셜 플랫폼에서 발급받은 OAuth 인가 코드
          example: abc123xyz

    GoogleOAuthRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: |
            앱이 기기 내 Google Sign-In(Play Services)으로 로그인해 발급받은 ID 토큰(JWT).
            서버는 이 토큰의 서명·발급자·audience(Web 클라이언트 ID)만 검증하고, 클레임에서
            사용자 정보를 바로 추출한다 (2026-08-26 결정: code→client_secret 교환 방식에서 전환,
            decision-log 참고). 카카오는 기존 인가 코드 방식(OAuthRequest)을 그대로 유지.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1In0...

    OAuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: API 요청 인증에 사용하는 JWT 액세스 토큰 (유효시간 1시간)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: 액세스 토큰 갱신에 사용하는 리프레시 토큰 (유효시간 30일)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        is_new_user:
          type: boolean
          description: |
            최초 가입 여부. true이면 클라이언트가 온보딩 플로우로 이동해야 함.
            false이면 has_onboarded 값에 따라 홈 또는 온보딩으로 분기.
          example: true

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: 기존에 발급받은 리프레시 토큰

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: 새로 발급된 JWT 액세스 토큰
        refresh_token:
          type: string
          description: |
            새로 발급된 JWT 리프레시 토큰(회전, 2026-09-04 도입). 기존 리프레시 토큰은 이 요청으로
            즉시 폐기되므로, 클라이언트는 저장된 리프레시 토큰을 반드시 이 값으로 교체해야 함

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nickname:
          type: string
          example: 여행자
        profile_image_url:
          type: string
          nullable: true
        oauth_provider:
          type: string
          enum: [kakao, google]
        has_onboarded:
          type: boolean
          description: |
            온보딩 취향 분석 완료 여부.
            앱 재시작 시 이 값이 false이면 온보딩 화면으로 이동해야 함.
            POST /onboarding/preferences 호출 시 true로 업데이트됨.
          example: true
        created_at:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 50
          description: 변경할 닉네임
        profile_image_url:
          type: string
          nullable: true
          description: 변경할 프로필 이미지 URL (Presigned URL로 업로드 후 반환된 file_url)

    NotificationSetting:
      type: object
      properties:
        push_enabled:
          type: boolean
          description: 푸시 알림 전체 수신 동의 여부. false이면 아래 세부 항목 무관하게 알림 미발송.
          example: true
        event_alert:
          type: boolean
          description: 사용자의 여행 예정일 기준으로 근처 행사 및 축제가 있을 때 알림 발송 여부
          example: true
        course_reminder:
          type: boolean
          description: 저장된 코스의 travel_date 당일 아침에 리마인더 알림 발송 여부
          example: false

    DeviceTokenRequest:
      type: object
      required: [fcm_token, platform]
      properties:
        fcm_token:
          type: string
          description: Firebase Cloud Messaging 디바이스 토큰. 앱 설치 후 FCM SDK에서 발급됨.
          example: fLkT3vX2...
        platform:
          type: string
          enum: [ios, android]
          description: 디바이스 플랫폼 구분. 알림 payload 포맷 분기에 사용됨.
          example: ios

    TagItem:
      type: object
      description: 감성 태그. 7개 분위기 태그가 SSOT 기준으로 관리됨.
      properties:
        tag:
          type: string
          description: 영문 태그 키
          example: relaxing
        label:
          type: string
          description: 한국어 표시명
          example: Relaxing
        description:
          type: string
          description: 태그 의미 설명
          example: 여유, 힐링, 자연, 조용함
        criteria:
          type: array
          items:
            type: string
          description: AI 이미지 분석 시 판단 기준 (5가지)
          example: [한적함 있음, 조용한 분위기 있음, 개방감 있음, 자연 요소 있음, 오래 머물고 싶은 분위기 있음]

    OnboardingCard:
      type: object
      description: 온보딩 화면에서 보여주는 감성 이미지 카드. 카드마다 7개 태그 벡터가 부여되어 있음.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          description: 장소명 또는 카드 제목
          example: 하회마을
        image_url:
          type: string
          description: 온보딩 화면에서 보여줄 감성 이미지 URL
          example: https://cdn.example.com/onboarding/hahoe.jpg
        vector:
          type: object
          description: |
            카드의 감성 벡터 (7개 태그 각각 0.0~1.0).
            AI가 사전 분석하여 DB에 저장된 값.
          properties:
            relaxing:
              type: number
              format: float
              example: 0.85
            lively:
              type: number
              format: float
              example: 0.10
            romantic:
              type: number
              format: float
              example: 0.30
            local:
              type: number
              format: float
              example: 0.60
            photogenic:
              type: number
              format: float
              example: 0.75
            traditional:
              type: number
              format: float
              example: 0.95
            modern:
              type: number
              format: float
              example: 0.05
        is_seed:
          type: boolean
          description: 시드 카드 여부. 온보딩 초반 7장은 태그별 대표 시드 카드로 구성됨.
          example: true

    OnboardingPreferenceRequest:
      type: object
      required: [selected_card_ids]
      properties:
        selected_card_ids:
          type: array
          items:
            type: string
          description: 사용자가 선택한 온보딩 카드 ID 목록
          example: [card_001, card_005, card_012]

    OnboardingPreferenceResponse:
      type: object
      properties:
        top_tags:
          type: array
          items:
            type: string
          description: 선택 결과에서 도출된 상위 감성 태그. 이후 스와이프 후보 추천의 기본값으로 사용됨.
          example: [고즈넉한, 자연친화, 감성카페]

    UserPreferenceTag:
      type: object
      properties:
        tag:
          type: string
          description: 감성 태그명
        score:
          type: number
          format: float
          description: |
            누적 점수. 온보딩 선택, 스와이프 like/must, 기록 업로드 시 AI 태그 분석 결과가
            누적되어 높아짐. 코스 생성 및 추천 알고리즘의 핵심 입력값.
          example: 4.5

    PlaceListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 하회마을
        category:
          type: string
          example: 관광지
        main_image_url:
          type: string
          nullable: true
        addr1:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        tags:
          type: array
          items:
            type: string
          description: 해당 장소에 누적된 감성 태그 상위 3개
        is_liked:
          type: boolean
          description: 인증 유저는 실제 좋아요 여부, 비인증 요청 시 false 고정

    PlaceMapPin:
      type: object
      description: |
        지도 뷰포트 기반 핀 표시용 경량 장소 데이터.
        상세 정보 없이 핀 렌더링에 필요한 최소 필드만 포함하여 응답 크기를 줄임.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        main_image_url:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        is_liked:
          type: boolean
          nullable: true
          description: 인증 유저는 실제 좋아요 여부, 비인증은 null. 핀 탭 시 하트 상태 즉시 표시에 사용.

    PlaceImage:
      type: object
      properties:
        img_url:
          type: string
        sort_order:
          type: integer

    PlaceHours:
      type: object
      description: 요일별 영업시간 한 구간. close_day/close_time이 null이면 open_day 당일 24시간 영업. 브레이크타임은 소스 데이터 부재로 미반영.
      properties:
        open_day:
          type: integer
          description: 0=일요일 ~ 6=토요일 (Google 기준)
          example: 1
        open_time:
          type: string
          format: time
          example: "09:00:00"
        close_day:
          type: integer
          nullable: true
          description: 자정 넘어가는 영업(예 금 22:00~토 02:00) 표현용
          example: 1
        close_time:
          type: string
          format: time
          nullable: true
          example: "18:00:00"


    UserVector:
      type: object
      description: 사용자 감성 벡터 전체 (7개 태그 독립 점수, 초기값 0.5)
      properties:
        relaxing:
          type: number
          format: float
          example: 0.72
        lively:
          type: number
          format: float
          example: 0.15
        romantic:
          type: number
          format: float
          example: 0.51
        local:
          type: number
          format: float
          example: 0.69
        photogenic:
          type: number
          format: float
          example: 0.88
        traditional:
          type: number
          format: float
          example: 0.82
        modern:
          type: number
          format: float
          example: 0.26

    OnboardingSwipeRequest:
      type: object
      required: [card_id, action]
      properties:
        card_id:
          type: integer
          format: int64
          description: 스와이프한 카드 ID
          example: 1
        action:
          type: string
          enum: [like, dislike]
          description: 좋아요 또는 싫어요
          example: like

    OnboardingSwipeResponse:
      type: object
      properties:
        user_vector:
          $ref: '#/components/schemas/UserVector'
        total_seen:
          type: integer
          description: 지금까지 본 카드 수
          example: 8
        is_converged:
          type: boolean
          description: 벡터 수렴 여부. true이면 온보딩 조기 종료 가능.
          example: false
        recent_change:
          type: number
          format: float
          description: 최근 3장 벡터 변화량 평균. 0.03 미만 AND 최소 15장 AND 좋아요 3개 이상이면 수렴 판단.
          example: 0.032

    OnboardingStatusResponse:
      type: object
      description: 온보딩 현재 진행 상태. 앱 재시작 시 복원에 사용.
      properties:
        total_seen:
          type: integer
          example: 8
        like_count:
          type: integer
          example: 5
        dislike_count:
          type: integer
          example: 3
        is_converged:
          type: boolean
          example: false
        user_vector:
          $ref: '#/components/schemas/UserVector'
        shown_card_ids:
          type: array
          items:
            type: integer
            format: int64
          description: 이미 보여준 카드 ID 목록
          example: [1, 3, 5, 7, 2, 4, 6]

    OnboardingNextResponse:
      type: object
      description: 알고리즘이 선택한 다음 온보딩 카드
      properties:
        card:
          $ref: '#/components/schemas/OnboardingCard'
        strategy:
          type: string
          enum: [seed, balance, explore, random]
          description: |
            카드 선택 전략 (v2.0.0).
            seed: 초반 7장 시드 카드.
            balance: 부족한 태그 보완 (60%).
            explore: 좋아요 취향과 유사한 카드 (30%).
            random: 패턴 탈출용 무작위 선택 (10%).
          example: balance
        weak_tags:
          type: array
          items:
            type: string
          description: 현재 정보가 부족한 태그 목록
          example: [lively, modern, romantic]

    VisitLogPhoto:
      type: object
      description: |
        방문 기록 사진 1장 + 캡션(선택). 여러 장 지원(2026-09-06 결정) 때는 URL 문자열이었는데,
        사진별 캡션 지원(2026-09-07 결정, decision-log 참고)으로 객체로 확장. VisitLogSummary/
        VisitLogDetail/VisitLogMapItem/SimilarLogItem이 공통으로 사용.
      properties:
        url:
          type: string
        caption:
          type: string
          nullable: true
          description: 이 사진에 대한 글. 없으면 null(캡션 없이 사진만 올린 경우).

    VisitLogSummary:
      type: object
      description: 장소 상세 화면의 기록 미리보기용 요약 데이터
      properties:
        id:
          type: integer
          format: int64
        photos:
          type: array
          items:
            $ref: '#/components/schemas/VisitLogPhoto'
          description: 여러 장 지원(2026-09-06 추가)+사진별 캡션(2026-09-07 추가, decision-log 참고). 사진이 없으면 빈 배열.
        title:
          type: string
          nullable: true
          description: 기록 제목. 2026-09-05 추가(메인 페이지-나의 일지-기록하기)
        one_line:
          type: string
          nullable: true
        weather:
          type: string
          nullable: true
          description: 자유 입력 텍스트(선택지 코드 없음). 2026-09-05 추가
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 별점(1~5), 선택 입력이라 없을 수 있음
        visited_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        nickname:
          type: string
          description: 작성자 닉네임. 관광지 상세 페이지 리뷰 카드용(2026-09-09 추가, decision-log 참고)
        profile_image_url:
          type: string
          nullable: true
          description: 작성자 프로필 사진. 2026-09-09 추가, decision-log 참고

    PlaceDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        content_id:
          type: string
          description: 한국관광공사 OpenAPI의 contentId. 출처 표시 및 데이터 업데이트 기준값.
        name:
          type: string
        category:
          type: string
        addr1:
          type: string
        addr2:
          type: string
          nullable: true
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        tel:
          type: string
          nullable: true
        main_image_url:
          type: string
          nullable: true
        overview:
          type: string
          nullable: true
          description: 한국관광공사 제공 장소 소개문
        homepage:
          type: string
          nullable: true
        event_start_date:
          type: string
          format: date
          nullable: true
          description: 축제/행사 카테고리인 경우 행사 시작일. 일반 장소는 null.
        event_end_date:
          type: string
          format: date
          nullable: true
          description: 축제/행사 카테고리인 경우 행사 종료일. 일반 장소는 null.
        images:
          type: array
          description: 장소 추가 이미지 목록 (관광공사 이미지정보 API 기반)
          items:
            $ref: '#/components/schemas/PlaceImage'
        hours:
          type: array
          description: 요일별 영업시간 목록 (커버리지 미확보 장소는 빈 배열)
          items:
            $ref: '#/components/schemas/PlaceHours'
        top_tags:
          type: array
          description: 사용자 기록에서 AI 분석으로 누적된 감성 태그 상위 목록. 장소 분위기를 직관적으로 전달하는 핵심 데이터.
          items:
            type: string
        visit_log_count:
          type: integer
          description: 이 장소에 기록된 총 방문 로그 수. 숨은 장소 여부 판단 기준값으로도 활용됨.
        avg_rating:
          type: number
          format: double
          nullable: true
          description: 방문 기록에 남긴 별점(1~5, 선택 입력)의 평균. 아무도 별점을 안 남겼으면 null.
        recent_logs:
          type: array
          description: |
            최근 기록 최대 5개 미리보기. 전체 목록은 GET /places/:placeId/logs 사용.
            스크롤 없이 장소 분위기를 빠르게 파악할 수 있도록 제공.
          items:
            $ref: '#/components/schemas/VisitLogSummary'
        is_liked:
          type: boolean
          nullable: true
          description: 인증 유저는 true/false, 비인증 요청은 null 반환

    LikeResponse:
      type: object
      properties:
        is_liked:
          type: boolean
          description: 요청 처리 후 최종 좋아요 상태

    SwipeCandidatesRequest:
      type: object
      required: [travel_date, transport]
      properties:
        travel_date:
          type: string
          format: date
          description: 여행 예정일. 축제/행사 카테고리 후보 필터링 및 코스 저장에 사용됨.
          example: '2025-11-10'
        transport:
          type: string
          enum: [car, walk, public]
          description: 이동 수단. 구글맵 Directions API 호출 시 보행자/자동차/대중교통 모드 분기에 사용됨.
        mood_tags:
          type: array
          items:
            type: string
          description: |
            원하는 여행 분위기 태그. 비어있으면 서버가 user_preference 상위 태그를 자동으로 사용.
            직접 입력하면 이번 여행에 한해 우선 적용됨.
        preferred_categories:
          type: array
          items:
            type: string
          description: 원하는 장소 카테고리. 비어있으면 전체 카테고리에서 추천.

    SwipeCandidate:
      type: object
      description: 스와이프 카드 한 장에 해당하는 장소 데이터
      properties:
        place_id:
          type: integer
          format: int64
        name:
          type: string
        main_image_url:
          type: string
          nullable: true
        category:
          type: string
        tags:
          type: array
          items:
            type: string

    SwipeCandidatesResponse:
      type: object
      properties:
        session_id:
          type: string
          description: |
            이번 스와이프 세션의 고유 ID. 결과 제출(POST /swipe/sessions/:sessionId/results)과
            코스 생성(POST /courses/generate) 요청에 이 값을 사용해야 함. 24시간 유효.
          example: swipe_session_abc123
        expires_at:
          type: string
          format: date-time
          description: 세션 만료 시각. 만료 후 결과 제출 또는 코스 생성 요청 시 410 반환.
        candidates:
          type: array
          description: 추천된 장소 카드 목록. 사용자 취향 태그와 장소 속성을 매칭하여 생성됨.
          items:
            $ref: '#/components/schemas/SwipeCandidate'

    SwipeSessionDetail:
      type: object
      description: 스와이프 세션 재조회 응답. 앱 복귀 시 진행 중이던 세션 상태를 복원하는 데 사용.
      properties:
        session_id:
          type: string
        expires_at:
          type: string
          format: date-time
        travel_date:
          type: string
          format: date
        transport:
          type: string
          enum: [car, walk, public]
        candidates:
          type: array
          description: 아직 스와이프하지 않은 잔여 후보 목록
          items:
            $ref: '#/components/schemas/SwipeCandidate'
        swiped_results:
          type: array
          description: 이미 스와이프한 결과 목록. 화면 복원 시 이미 처리된 카드를 건너뛰는 데 사용.
          items:
            type: object
            properties:
              place_id:
                type: integer
                format: int64
              action:
                type: string
                enum: [like, skip, must]

    SwipeResultRequest:
      type: object
      required: [swipes]
      properties:
        swipes:
          type: array
          description: 스와이프 결과 목록. like/must 장소는 user_preference 점수에 반영됨.
          items:
            type: object
            required: [place_id, action]
            properties:
              place_id:
                type: integer
                format: int64
              action:
                type: string
                enum: [like, skip, must]
                description: |
                  like: 마음에 드는 장소. 코스 후보에 포함될 수 있음.
                  skip: 넘긴 장소. 추천 점수에 약한 음수 반영.
                  must: 필수 방문 장소. 코스 생성 시 반드시 포함됨.

    CourseGenerateRequest:
      type: object
      required: [session_id, travel_date, transport]
      properties:
        session_id:
          type: string
          description: POST /swipe/candidates에서 발급받은 세션 ID
        travel_date:
          type: string
          format: date
          description: 여행 예정일. 저장 코스의 travel_date로 사용됨.
        transport:
          type: string
          enum: [car, walk, public]
          description: 이동 수단. 구글맵 Directions API 경유지 최적화(waypoints optimize) 호출 시 사용됨.
        start_time:
          type: string
          nullable: true
          description: >-
            여행 시작 시간(HH:mm). 없으면 09:00로 폴백. course_optimizer TripInput.start_time으로
            전달됨(travel_date와 합쳐짐). end_time과 함께 있을 때 end_time이 start_time보다 이르거나
            같으면 400(INVALID_COURSE_TIME_RANGE).
          example: '10:30'
        end_time:
          type: string
          nullable: true
          description: 여행 종료 시간(HH:mm). 없으면 21:00로 폴백. start_time 설명 참고.
          example: '18:00'

    CoursePlaceItem:
      type: object
      description: 코스에 포함된 장소 한 곳의 방문 정보
      properties:
        place_id:
          type: integer
          format: int64
        name:
          type: string
        visit_order:
          type: integer
          description: 방문 순서 (1부터 시작)
        planned_time:
          type: string
          nullable: true
          description: 예상 방문 시각 (HH:MM 형식)
          example: '10:00'
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        main_image_url:
          type: string
          nullable: true
        distance_from_prev_km:
          type: number
          nullable: true
          description: 직전 장소로부터의 이동 거리(km). 첫 번째 장소는 null.
        duration_from_prev_min:
          type: integer
          nullable: true
          description: 직전 장소로부터의 이동 시간(분). 첫 번째 장소는 null.
        visit_date:
          type: string
          format: date
          nullable: true
          description: |
            [2026-09-06 추가] 이 장소가 코스의 며칠째 방문지인지(YYYY-MM-DD). "직접 코스 만들기"로
            여러 날 코스를 만들 때만 채워짐. AI 코스 생성은 계속 단일 날짜 전제라 항상 null.

    CourseCandidate:
      type: object
      description: AI가 생성한 코스 후보 1개
      properties:
        candidate_id:
          type: string
          description: 후보 식별자. POST /courses 저장 시 candidate_id로 전달하면 source=ai로 저장됨.
        title:
          type: string
          description: '서버가 자동 생성한 코스 제목 (예: 고즈넉한 안동 하루)'
        places:
          type: array
          items:
            $ref: '#/components/schemas/CoursePlaceItem'
        total_distance_km:
          type: number
          description: 전체 코스 총 이동 거리(km)
        total_duration_min:
          type: integer
          description: 전체 코스 총 이동 시간(분)

    CourseGenerateResponse:
      type: object
      properties:
        candidates:
          type: array
          minItems: 1
          maxItems: 3
          description: |
            생성된 코스 후보 목록 (최대 3개).
            각 후보는 사용자 취향 태그, 장소 카테고리 균형, 이동 거리, must 장소 포함 여부를 달리 조합하여 생성됨.

            [구현 현황 2026-08-30] ai/course_optimizer가 아직 경로 1개만 반환할 수 있어(백트래킹이
            k별 최고점 1개만 유지) 현재는 항상 1개만 채워짐. must 장소도 강제 포함이 안 돼서 스와이프에서
            like/must로 표시한 장소만 후보 풀로 좁혀 넘기는 근사치로 처리 중 (완전히 시간에 다 들어가면
            전부 포함되지만, 부족하면 어느 것이 빠질지는 보장 못 함). 둘 다 course_optimizer 알고리즘
            자체의 확장이 필요해 별도 논의 대상 (decision-log 참고).
          items:
            $ref: '#/components/schemas/CourseCandidate'

    CourseSaveRequest:
      type: object
      required: [title, source, places]
      properties:
        candidate_id:
          type: string
          nullable: true
          description: AI 생성 코스를 저장하는 경우 해당 후보 ID. 직접 구성 코스는 null.
        title:
          type: string
          maxLength: 200
          description: 코스 이름. AI 생성 시 자동 제목을 그대로 쓰거나 사용자가 수정 가능.
        travel_date:
          type: string
          format: date
          nullable: true
          description: 여행 예정일. 이 날짜를 기준으로 course_reminder 알림이 발송됨.
        transport:
          type: string
          enum: [car, walk, public]
          nullable: true
          description: |
            [2026-08-30 추가] 구글맵 경로 재계산(GET /courses/{courseId})에 사용할 이동수단.
            AI 생성 코스는 보통 /swipe/candidates에서 쓴 값을 그대로 전달. 비어있으면 조회 시 walk로 계산.
        source:
          type: string
          enum: [ai, ai_edited, user]
          description: |
            ai: AI가 생성한 코스를 그대로 저장.
            ai_edited: AI 생성 후 사용자가 장소를 수정/삭제한 코스.
            user: 사용자가 직접 구성한 코스.
        places:
          type: array
          description: 저장할 장소 목록. 구글맵 응답(이동시간/거리)은 저장하지 않으며 장소 목록과 순서만 저장함.
          items:
            type: object
            required: [place_id, visit_order]
            properties:
              place_id:
                type: integer
                format: int64
              visit_order:
                type: integer
              planned_time:
                type: string
                nullable: true
              visit_date:
                type: string
                format: date
                nullable: true
                description: '[2026-09-06 추가] 며칠째 방문지인지. POST /courses/manual에서만 실제 검증됨(CourseDetail.end_date 참고).'

    CourseSaveResponse:
      type: object
      properties:
        course_id:
          type: integer
          format: int64
          description: 저장된 코스의 ID. 이후 GET /courses/:courseId로 조회 가능.

    CourseListItem:
      type: object
      description: 코스 목록 화면에서 사용되는 요약 데이터
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        travel_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: 여러 날 범위 지원(2026-09-06 추가). "직접 코스 만들기"에서만 채워짐.
        source:
          type: string
          enum: [ai, ai_edited, user, journal]
          description: journal=나의 일지 기록하기에서 장소 2개 이상 골라 사후 생성된 코스(2026-09-08 추가, decision-log 참고)
        place_count:
          type: integer
          description: 코스에 포함된 장소 수
        thumbnail_url:
          type: string
          nullable: true
          description: 코스 대표 썸네일. 첫 번째 장소의 main_image_url 사용.
        place_thumbnails:
          type: array
          items:
            type: string
          description: |
            스크랩북 카드의 썸네일 스트립용. 방문 순서 기준 최대 3장의 main_image_url.
            place_count가 이 배열 길이보다 크면 그 차이를 "N+" 배지로 표시. (2026-09-05 추가)
        created_at:
          type: string
          format: date-time

    CourseDetail:
      type: object
      description: 코스 상세 화면 데이터. 조회 시마다 구글맵 API를 재호출하여 최신 경로 정보를 포함함.
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        travel_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: 여러 날 범위 지원(2026-09-06 추가). "직접 코스 만들기"에서만 채워짐.
        source:
          type: string
          enum: [ai, ai_edited, user, journal]
          description: journal=나의 일지 기록하기에서 장소 2개 이상 골라 사후 생성된 코스(2026-09-08 추가, decision-log 참고)
        places:
          type: array
          description: 방문 순서대로 정렬된 장소 목록. 각 장소에 구글맵 재계산 결과(이동시간/거리)가 포함됨.
          items:
            $ref: '#/components/schemas/CoursePlaceItem'
        total_distance_km:
          type: number
          nullable: true
        total_duration_min:
          type: integer
          nullable: true
        polyline:
          type: string
          nullable: true
          description: 구글맵 재계산 응답 폴리라인(인코딩된 polyline). 지도에 경로선을 그리는 데 사용됨.
        updated_at:
          type: string
          format: date-time

    CourseUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        source:
          type: string
          enum: [ai_edited, user]
          description: 수정 시 source는 ai_edited 또는 user로만 변경 가능. ai로 되돌릴 수 없음.
        places:
          type: array
          description: 수정된 장소 목록 전체. 기존 목록을 전체 교체하는 방식으로 동작함.
          items:
            type: object
            required: [place_id, visit_order]
            properties:
              place_id:
                type: integer
                format: int64
              visit_order:
                type: integer
              planned_time:
                type: string
                nullable: true
              visit_date:
                type: string
                format: date
                nullable: true
                description: '[2026-09-06 추가] 며칠째 방문지인지. 코스가 여러 날 범위(end_date 있음)면 그 범위 안이어야 함(안 지키면 400).'

    VisitLogDetail:
      type: object
      description: 여행 기록 상세 데이터. 기록 작성 응답과 단건 조회 응답에 공통으로 사용됨.
      properties:
        id:
          type: integer
          format: int64
        place_id:
          type: integer
          format: int64
        place_name:
          type: string
        course_id:
          type: integer
          format: int64
          nullable: true
          description: 코스 단위 기록(장소 2개 이상)일 때만 값 있음. 2026-09-08 추가, decision-log 참고
        course_title:
          type: string
          nullable: true
          description: course_id가 있을 때 그 코스의 제목. 2026-09-08 추가, decision-log 참고
        photos:
          type: array
          items:
            $ref: '#/components/schemas/VisitLogPhoto'
          description: 여러 장 지원(2026-09-06 추가)+사진별 캡션(2026-09-07 추가, decision-log 참고). 사진이 없으면 빈 배열.
        title:
          type: string
          nullable: true
          description: 기록 제목. 2026-09-05 추가(메인 페이지-나의 일지-기록하기)
        one_line:
          type: string
          nullable: true
        weather:
          type: string
          nullable: true
          description: 자유 입력 텍스트(선택지 코드 없음). 2026-09-05 추가
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 별점(1~5), 선택 입력이라 없을 수 있음
        visited_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
          description: |
            AI 이미지 분석으로 자동 부여된 감성 태그(비동기 배치, 작성 직후엔 빈 배열일 수 있음).
            장소의 상위 태그(GET /places/:placeId의 top_tags)에도 조회 시점에 직접 집계되어 반영되며,
            user_preference 점수에도 반영됨.

    VisitLogUpdateRequest:
      type: object
      description: |
        사진은 수정 불가. 제목·한줄 리뷰·날씨·별점·방문 날짜만 수정 가능.
        title/one_line/weather를 빈 문자열("")로 보내면 해당 값이 삭제됨(null로 저장). 필드 자체를 생략하면 기존 값 유지.
        rating은 이들과 달리 빈 값으로 지우는 기능이 없음 — 값을 보내면 갱신, 생략하면 기존 값 유지.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 50
        one_line:
          type: string
          nullable: true
          maxLength: 100
        weather:
          type: string
          nullable: true
          maxLength: 20
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 별점(1~5)
        visited_at:
          type: string
          format: date-time
          nullable: true

    VisitLogMapItem:
      type: object
      description: 개인 로그 지도 화면에서 핀으로 표시되는 기록 데이터
      properties:
        id:
          type: integer
          format: int64
        place_id:
          type: integer
          format: int64
        place_name:
          type: string
        course_id:
          type: integer
          format: int64
          nullable: true
          description: |
            코스 단위 기록(장소 2개 이상)일 때만 값 있음. 나의 일지 화면은 같은 course_id를 가진
            기록들을 하나의 코스 카드로 묶어서 보여준다. 2026-09-08 추가, decision-log 참고
        course_title:
          type: string
          nullable: true
          description: course_id가 있을 때 그 코스의 제목. 2026-09-08 추가, decision-log 참고
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        photos:
          type: array
          items:
            $ref: '#/components/schemas/VisitLogPhoto'
          description: 여러 장 지원(2026-09-06 추가)+사진별 캡션(2026-09-07 추가, decision-log 참고). 사진이 없으면 빈 배열.
        title:
          type: string
          nullable: true
          description: 기록 제목. 2026-09-05 추가(메인 페이지-나의 일지-기록하기)
        one_line:
          type: string
          nullable: true
        weather:
          type: string
          nullable: true
          description: 자유 입력 텍스트(선택지 코드 없음). 2026-09-05 추가
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 별점(1~5), 선택 입력이라 없을 수 있음
        visited_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string

    SimilarLogItem:
      type: object
      description: |
        유사 취향 사용자의 공개 여행 기록. 추천 점수에는 반영하지 않으며
        지도 탐색 화면에서 참고 콘텐츠로 제공됨.
      properties:
        log_id:
          type: integer
          format: int64
        place_id:
          type: integer
          format: int64
        place_name:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        photos:
          type: array
          items:
            $ref: '#/components/schemas/VisitLogPhoto'
          description: |
            여러 장 사진 확장은 처음엔 범위 밖이었는데(2026-09-06 결정), "취향 맞춤 코스" 카드에서
            사진을 넘기면 그 사진에 달린 글로 바뀌어야 해서(2026-09-07 결정, decision-log 참고)
            대표 사진 1장(photo_url)에서 전체 목록+캡션(photos)으로 확장. 사진이 없으면 빈 배열.
        one_line:
          type: string
          nullable: true
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 별점(1~5), 선택 입력이라 없을 수 있음
        tags:
          type: array
          items:
            type: string
        nickname:
          type: string
        profile_image_url:
          type: string
          nullable: true

    SimilarCoursePlacePreview:
      type: object
      description: |
        코스 안 장소 하나의 미리보기(이름+썸네일). "취향 맞춤 코스" 카드에서 사진을 넘기면
        그 장소 이름으로 설명 텍스트가 바뀌게 하기 위한 쌍(2026-09-07 결정, decision-log 참고).
      properties:
        name:
          type: string
        thumbnail_url:
          type: string
          nullable: true

    SimilarCourseItem:
      type: object
      description: |
        유사 취향 사용자의 공개 코스. "취향 맞춤 코스" 탭 카드 목록용(2026-09-07 결정,
        decision-log 참고). 장소 좌표/전체 경로는 없음 — "선택" 시
        GET /explore/courses/{course_id}(CourseDetail)로 따로 조회해서 지도 미리보기에 씀.
      properties:
        course_id:
          type: integer
          format: int64
        title:
          type: string
        travel_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        place_count:
          type: integer
        place_previews:
          type: array
          items:
            $ref: '#/components/schemas/SimilarCoursePlacePreview'
          description: 방문 순서 기준 최대 3장(카드 사진 캐러셀용)
        nickname:
          type: string
        profile_image_url:
          type: string
          nullable: true

    PresignedUrlRequest:
      type: object
      required: [filename, content_type]
      properties:
        filename:
          type: string
          description: 업로드할 파일명 (확장자 포함)
          example: visit_photo.jpg
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
          description: 파일 MIME 타입
        purpose:
          type: string
          enum: [visit_log, profile]
          description: 업로드 목적. S3 저장 경로 분기에 사용됨 (visit_logs/ 또는 profiles/).
          example: visit_log

    PresignedUrlResponse:
      type: object
      properties:
        upload_url:
          type: string
          description: S3에 직접 PUT 요청을 보낼 Presigned URL. 유효시간 10분.
        file_url:
          type: string
          description: 업로드 완료 후 실제 서비스에서 사용할 파일 공개 URL. 이 값을 photos[].url 등에 저장.
        expires_in:
          type: integer
          description: Presigned URL 유효 시간(초)
          example: 600

    EventListItem:
      type: object
      description: 행사 및 축제 목록 아이템. 장소 데이터와 동일한 place 테이블에서 category=축제행사인 레코드.
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 안동 국제탈춤페스티벌
        main_image_url:
          type: string
          nullable: true
        addr1:
          type: string
        event_start_date:
          type: string
          format: date
        event_end_date:
          type: string
          format: date
        tags:
          type: array
          items:
            type: string
        d_day:
          type: integer
          description: 오늘 기준 행사 시작까지 남은 일수. 진행 중이면 0, 종료 후이면 -1.
          example: 5

paths:

  /auth/oauth/kakao:
    post:
      tags: [Auth]
      summary: 카카오 로그인
      description: |
        카카오 OAuth 인가 코드를 서버에 전달하여 서비스 JWT 토큰을 발급받는다.
        최초 가입 시 is_new_user=true를 반환하며, 클라이언트는 온보딩 플로우로 이동해야 한다.
        기존 유저는 has_onboarded 값에 따라 홈 또는 온보딩으로 분기한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
        '400':
          description: 잘못된 인가 코드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/kakao/callback:
    get:
      tags: [Auth]
      summary: 카카오 로그인 리다이렉트 중계 (앱이 직접 호출하지 않음)
      description: |
        카카오 개발자 콘솔의 Redirect URI가 커스텀 스킴(dongle://)을 거부해서(2026-08-27 확인,
        decision-log 참고) 등록해둔 HTTPS 중계 엔드포인트. 카카오가 로그인 승인 후 이 주소로
        code(또는 error) 쿼리스트링을 붙여 리다이렉트하면, 서버는 그 쿼리스트링을 그대로 유지한 채
        앱의 커스텀 스킴(dongle://redirect)으로 302 리다이렉트만 해준다 — 실제 로그인 처리는
        전혀 하지 않으며 POST /auth/oauth/kakao와는 무관하다.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: 카카오가 붙여주는 인가 코드 (또는 실패 시 error/error_description)
      responses:
        '302':
          description: dongle://redirect(+원본 쿼리스트링)로 리다이렉트

  /auth/oauth/google:
    post:
      tags: [Auth]
      summary: 구글 로그인
      description: |
        앱이 기기 내 네이티브 Google Sign-In으로 로그인해 받은 ID 토큰을 서버에 전달하여
        서비스 JWT 토큰을 발급받는다. 카카오와 달리 인가 코드 교환이 아니라 ID 토큰 검증 방식이다
        (2026-08-26 결정, decision-log 참고) — Android OAuth 클라이언트(패키지명+SHA-1)로 로그인을
        수행하고, Web 애플리케이션 OAuth 클라이언트의 ID를 audience(서버 클라이언트 ID)로 지정한다.
        응답 형태·의미(is_new_user 등)는 카카오 로그인과 동일하다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleOAuthRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthResponse'
        '400':
          description: 유효하지 않은 ID 토큰 (서명/발급자/audience 불일치, 만료 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Access Token 갱신
      description: |
        만료된 액세스 토큰을 갱신한다.
        리프레시 토큰은 30일간 유효하며, 유효한 리프레시 토큰이 있으면 재로그인 없이 새 액세스 토큰을 발급받을 수 있다.
        리프레시 토큰도 만료된 경우 401이 반환되며 재로그인이 필요하다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: 유효하지 않거나 만료된 리프레시 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    delete:
      tags: [Auth]
      summary: 로그아웃
      description: |
        서버에 저장된 리프레시 토큰을 무효화한다.
        이후 해당 리프레시 토큰으로 액세스 토큰 갱신을 시도하면 401이 반환된다.
        클라이언트는 로컬에 저장된 토큰도 함께 삭제해야 한다.
      responses:
        '204':
          description: 로그아웃 성공
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags: [User]
      summary: 내 프로필 조회
      description: |
        현재 로그인한 사용자의 프로필 정보를 반환한다.
        앱 재시작 시 has_onboarded 값을 확인하여 온보딩 완료 여부를 판단한다.
        false이면 온보딩 화면으로, true이면 홈 화면으로 이동한다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [User]
      summary: 내 프로필 수정
      description: |
        닉네임 또는 프로필 이미지를 수정한다.
        프로필 이미지 변경 시 먼저 POST /uploads/presigned-url로 이미지를 S3에 업로드한 뒤
        반환된 file_url을 profile_image_url에 담아 요청해야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [User]
      summary: 회원 탈퇴
      description: |
        사용자 계정을 완전히 삭제한다 (Hard delete).
        연관된 좋아요, 여행 기록, 저장된 코스, 취향 프로필이 CASCADE로 함께 삭제된다.
        삭제된 계정은 복구할 수 없으므로 클라이언트에서 재확인 UX를 제공해야 한다.
      responses:
        '204':
          description: 탈퇴 성공
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/preferences:
    get:
      tags: [Onboarding]
      summary: 내 취향 태그 조회
      description: |
        현재 사용자의 감성 태그별 점수를 조회한다.
        점수는 온보딩 선택, 스와이프 결과, 여행 기록 AI 분석 태그가 누적될수록 높아진다.
        스와이프 후보 요청 시 mood_tags를 비워두면 이 목록의 상위 태그가 자동으로 사용된다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserPreferenceTag'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/likes:
    get:
      tags: [Like]
      summary: 내가 좋아요한 장소 목록
      description: |
        사용자가 좋아요한 장소 전체 목록을 반환한다.
        마이페이지 또는 저장 목록 화면에서 사용된다.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaceListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/courses:
    get:
      tags: [Course]
      summary: 내 저장된 코스 목록
      description: |
        사용자가 저장한 코스 전체 목록을 반환한다.
        마이페이지 또는 코스 목록 화면에서 사용되며,
        코스 상세 조회(GET /courses/:courseId)를 통해 경로 안내를 시작할 수 있다.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/logs:
    get:
      tags: [VisitLog]
      summary: 내 여행 기록 목록 (개인 로그 지도용)
      description: |
        사용자가 작성한 여행 기록 전체를 반환한다.
        각 기록에 장소 좌표(lat, lng)가 포함되어 있어 개인 로그 지도에 핀으로 표시하는 데 사용된다.
        기록을 탭하면 GET /logs/:logId로 상세 화면으로 이동한다.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitLogMapItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/notification:
    get:
      tags: [User]
      summary: 알림 설정 조회
      description: |
        현재 사용자의 알림 설정을 조회한다.
        설정 화면 진입 시 현재 상태를 불러오는 데 사용된다.
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSetting'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [User]
      summary: 알림 설정 수정
      description: |
        푸시 알림 동의 여부 및 세부 항목을 변경한다.
        유저플로우 1의 최초 가입 시 알림 동의 설정과, 이후 설정 화면에서의 변경 모두 이 엔드포인트를 사용한다.
        실제 푸시 발송은 FCM 토큰이 등록된 경우에만 동작한다 (POST /users/me/device-token 참고).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSetting'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSetting'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/device-token:
    post:
      tags: [User]
      summary: FCM 디바이스 토큰 등록
      description: |
        푸시 알림 발송을 위한 Firebase Cloud Messaging 디바이스 토큰을 서버에 등록한다.
        앱 설치 후 FCM SDK에서 토큰을 발급받는 즉시, 또는 토큰이 갱신될 때마다 호출해야 한다.
        알림 설정(PATCH /users/me/notification)에서 동의하더라도 이 토큰이 없으면 실제 푸시가 발송되지 않는다.
        동일 사용자가 여러 디바이스를 사용하는 경우를 위해 플랫폼별로 최신 토큰을 덮어씀.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '204':
          description: 토큰 등록 성공
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tags:
    get:
      tags: [Tag]
      summary: 감성 태그 전체 목록 조회
      description: |
        서비스 전체에서 공통으로 사용하는 감성 태그셋을 반환한다.
        온보딩 카드 태그, 스와이프 mood_tags 입력, 여행 기록 AI 분석, 장소 분위기 태그 등
        모든 태그 관련 UI의 기준 목록이 이 엔드포인트에서 관리된다.
        클라이언트가 태그를 하드코딩하지 않고 서버에서 가져와야 서버/클라이언트 태그 불일치를 방지할 수 있다.
      security: []
      parameters:
        - name: category
          in: query
          description: 태그 분류 필터 (분위기 / 활동 / 장소유형)
          schema:
            type: string
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      $ref: '#/components/schemas/TagItem'
              example:
                tags:
                  - tag: relaxing
                    label: Relaxing
                    description: 여유, 힐링, 자연, 조용함
                    criteria: [한적함 있음, 조용한 분위기 있음, 개방감 있음, 자연 요소 있음, 오래 머물고 싶은 분위기 있음]
                  - tag: lively
                    label: Lively
                    description: 활기, 시장, 축제, 북적임
                    criteria: [사람 밀집도 높음, 활동적인 분위기 있음, 상업적 활기 있음, 축제·행사 분위기 있음, 에너지 있는 분위기 있음]
                  - tag: romantic
                    label: Romantic
                    description: 야경, 데이트, 감성
                    criteria: [감성적인 조명 있음, 따뜻한 색감 있음, 아늑한 분위기 있음, 감성적인 연출 요소 있음, 특별한 추억을 만들고 싶은 분위기 있음]
                  - tag: local
                    label: Local
                    description: 동네감성, 골목, 숨은명소
                    criteria: [지역 고유의 분위기 있음, 생활감 있는 공간 있음, 지역 문화 요소 있음, 지역만의 개성 있음, 소박한 분위기 있음]
                  - tag: photogenic
                    label: Photogenic
                    description: 사진 찍기 좋은 분위기
                    criteria: [좋은 사진 구도 있음, 아름다운 배경 있음, 매력적인 색감·조명 있음, 시선을 끄는 포인트 있음, 사진으로 남기고 싶은 장면 있음]
                  - tag: traditional
                    label: Traditional
                    description: 전통적인, 역사적인, 한국적인 감성
                    criteria: [전통적인 분위기 있음, 역사적인 분위기 있음, 한국적인 감성 있음, 고즈넉한 분위기 있음, 문화유산적인 분위기 있음]
                  - tag: modern
                    label: Modern
                    description: 현대적인, 세련된, 트렌디한 분위기
                    criteria: [현대적인 분위기 있음, 도시적인 분위기 있음, 세련된 분위기 있음, 트렌디한 분위기 있음, 감각적인 분위기 있음]

  /onboarding/cards:
    get:
      tags: [Onboarding]
      summary: "[DEPRECATED 가능성] 온보딩 이미지 카드 목록 조회 (카드 다중 선택 방식)"
      description: |
        ⚠️ 확정된 온보딩 알고리즘(v2.0.0, Onboarding Algo.md, decision-log 2026-07-07)은
        카드를 한 번에 여러 장 보여주고 선택받는 방식이 아니라, GET /onboarding/next로 한 장씩
        스와이프하는 방식으로 결정되었다. 이 엔드포인트는 그 이전 설계의 흔적일 수 있어
        실제 사용 여부를 팀에서 재확인 후 정리 필요. 최초 가입 후 취향 분석 단계에서
        사용자에게 보여줄 감성 이미지 카드 목록을 반환한다.
        각 카드에는 분위기, 활동 유형 등의 감성 태그가 부여되어 있으며,
        사용자가 선택한 카드의 태그들이 집계되어 user_preference 초기값으로 저장된다.
      security: []
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/OnboardingCard'

  /onboarding/preferences:
    post:
      tags: [Onboarding]
      summary: 온보딩 취향 선택 결과 제출
      description: |
        사용자가 선택한 온보딩 카드 ID 목록을 제출한다.
        서버는 선택된 카드의 감성 태그를 집계하여 user_preference 테이블에 초기 점수로 저장한다.
        처리 완료 후 users.has_onboarded를 true로 업데이트하므로, 이후 앱 재시작 시 온보딩을 건너뛰게 된다.
        반환되는 top_tags는 이후 스와이프 화면의 기본 mood_tags로 사용된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingPreferenceRequest'
      responses:
        '200':
          description: 취향 프로필 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingPreferenceResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /onboarding/status:
    get:
      tags: [Onboarding]
      summary: 온보딩 진행 상태 조회
      description: 앱 재시작 시 온보딩 진행 상태를 복원하는 데 사용한다. 이미 본 카드 목록, 현재 벡터, 수렴 여부 반환.
      responses:
        '200':
          description: 상태 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatusResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /onboarding/next:
    get:
      tags: [Onboarding]
      summary: 다음 온보딩 카드 요청 (적응형 알고리즘)
      description: |
        서버가 적응형 알고리즘으로 다음 카드를 선택하여 반환한다 (v2.0.0).
        시드 7장 → 균형(60%) + 탐색(30%) + 랜덤(10%) 혼합 전략.
        수렴 완료(최근 3장 변화량 평균 < 0.03 AND 최소 15장 AND 좋아요 3개 이상) 또는 최대 25장 도달 시 204 반환.
      responses:
        '200':
          description: 다음 카드 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingNextResponse'
        '204':
          description: 온보딩 종료 조건 도달
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /onboarding/swipe:
    post:
      tags: [Onboarding]
      summary: 온보딩 카드 스와이프 (좋아요 / 싫어요)
      description: |
        카드 선택 결과를 제출하고 user_preference 벡터를 업데이트한다 (v2.0.0).
        상대적 업데이트: 카드 평균 기준으로 강한 태그는 올리고 약한 태그는 내림.
        좋아요 +0.40 / 싫어요 -0.25. 초기값 0.5, 범위 0.0~1.0. 정규화 없음.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingSwipeRequest'
      responses:
        '200':
          description: 벡터 업데이트 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSwipeResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /onboarding/complete:
    post:
      tags: [Onboarding]
      summary: 온보딩 완료 처리
      description: |
        온보딩을 완료하고 users.has_onboarded=true로 업데이트.
        완료 후 최종 user_vector와 상위 3개 태그 반환.
        반환된 top_tags는 스와이프 화면 기본 mood_tags로 사용됨.
      responses:
        '200':
          description: 완료 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_vector:
                    $ref: '#/components/schemas/UserVector'
                  top_tags:
                    type: array
                    items:
                      type: string
                    example: [traditional, relaxing, photogenic]
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /onboarding/reset:
    post:
      tags: [Onboarding]
      summary: 취향 재분석 (온보딩 초기화)
      description: |
        마이페이지에서 취향을 다시 분석하고 싶을 때 사용한다.
        user_preference 벡터를 초기값(0.5)으로 리셋하고
        has_onboarded를 false로 변경하여 온보딩 플로우를 재시작할 수 있도록 한다.
        기존 여행 기록, 좋아요, 저장 코스는 삭제되지 않는다.
      responses:
        '200':
          description: 초기화 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_vector:
                    $ref: '#/components/schemas/UserVector'
                  message:
                    type: string
                    example: 취향 벡터가 초기화되었습니다. 온보딩을 다시 시작해주세요.
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /places:
    get:
      tags: [Place]
      summary: 장소 목록 조회 (카테고리 탐색)
      description: |
        카테고리별 장소 목록을 페이징하여 반환한다.
        홈 화면의 카테고리 탭(관광지, 식당, 카페, 액티비티, 축제행사, 기타)에서 사용된다.
        축제행사 카테고리에서 travel_date를 함께 전달하면 해당 날짜에 진행 중인 행사만 필터링된다.
        인증 유저는 각 장소의 is_liked 값이 실제 좋아요 여부로 반환된다.
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [관광지, 식당, 카페, 액티비티, 축제행사, 기타]
        - name: travel_date
          in: query
          description: 축제행사 카테고리 기간 필터 (YYYY-MM-DD). 해당 날짜가 event_start_date ~ event_end_date 사이인 행사만 반환.
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaceListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /places/map:
    get:
      tags: [Place]
      summary: 지도 뷰포트 기반 장소 핀 조회
      description: |
        지도 화면에서 사용자가 드래그하거나 줌인/줌아웃할 때 현재 화면 영역(bounds) 내 장소 핀을 반환한다.
        목록형 탐색(GET /places)과 달리 좌표, 카테고리, 썸네일, 태그, is_liked만 포함한 경량 응답으로
        다수의 핀을 빠르게 지도 위에 렌더링하는 데 최적화되어 있다.
        is_liked는 핀을 탭했을 때 하트 상태를 즉시 표시하기 위해 포함됨.
        bounds 파라미터는 필수이며, 지도 SDK의 현재 뷰포트 좌표를 sw_lat,sw_lng,ne_lat,ne_lng 순으로 전달한다.
      security: []
      parameters:
        - name: bounds
          in: query
          required: true
          description: 지도 뷰포트 좌표. 형식은 sw_lat,sw_lng,ne_lat,ne_lng (남서-북동 꼭짓점)
          schema:
            type: string
            example: 36.48,128.45,36.58,128.56
        - name: category
          in: query
          description: 카테고리 필터. 없으면 전체 카테고리 핀을 반환.
          schema:
            type: string
            enum: [관광지, 식당, 카페, 액티비티, 축제행사, 기타]
        - name: travel_date
          in: query
          description: 축제행사 카테고리 기간 필터
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  pins:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaceMapPin'
                  total:
                    type: integer

  /places/featured:
    get:
      tags: [Place]
      summary: 추천 및 인기 장소 목록
      description: |
        홈 화면 진입 시 기본 콘텐츠로 보여줄 장소 목록을 반환한다.
        인증 유저의 경우 user_preference 상위 태그와 장소 속성을 매칭하여 개인화 추천 목록을 반환하며,
        비인증 유저의 경우 visit_log_count와 emotion_tag count를 기반으로 인기 장소를 반환한다.
        is_personalized 플래그로 두 경우를 구분하여 UI에서 "맞춤 추천" / "인기 장소" 레이블을 다르게 표시할 수 있다.
      security: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaceListItem'
                  is_personalized:
                    type: boolean
                    description: true이면 개인화 추천, false이면 인기 기반

  /places/search:
    get:
      tags: [Place]
      summary: 장소 키워드 검색
      description: |
        장소명 또는 주소 키워드로 안동 지역 장소를 검색한다.
        홈 화면 검색 바에서 사용되며, 검색 결과는 관련도 순으로 반환된다.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: 검색 키워드 (장소명 또는 주소)
          schema:
            type: string
            example: 하회
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 검색 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  places:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaceListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /places/{placeId}:
    get:
      tags: [Place]
      summary: 장소 상세 조회
      description: |
        장소의 전체 상세 정보를 반환한다.
        대표 이미지, 추가 이미지, 소개문, 이용 정보, 누적 감성 태그, 최근 기록 미리보기(최대 5개)를 포함한다.
        비인증 요청도 허용하며, 인증 유저는 is_liked로 현재 좋아요 여부를 확인할 수 있고 비인증은 null 반환.
        recent_logs는 미리보기용으로 최대 5개만 포함되며, 전체 기록은 GET /places/:placeId/logs에서 페이징으로 조회한다.
        content_id는 한국관광공사 OpenAPI의 출처 contentId로, 출처 표시 UI에 활용된다.
      security: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetail'
        '404':
          description: 장소 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /places/{placeId}/like:
    post:
      tags: [Like]
      summary: 좋아요 추가
      description: |
        장소에 좋아요를 추가한다.
        장소 상세 화면 또는 목록/지도 핀에서 하트 버튼을 탭할 때 호출된다.
        이미 좋아요한 장소에 재요청하면 409를 반환하므로, 클라이언트는 is_liked 상태를 확인 후 호출해야 한다.
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 추가 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 좋아요한 장소
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Like]
      summary: 좋아요 취소
      description: |
        장소에 추가한 좋아요를 취소한다.
        하트 버튼을 다시 탭하거나 좋아요 목록에서 제거할 때 호출된다.
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 취소 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 좋아요 기록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /places/{placeId}/logs:
    get:
      tags: [VisitLog]
      summary: 장소별 여행 기록 목록 (페이징)
      description: |
        특정 장소에 작성된 모든 사용자의 여행 기록을 페이징하여 반환한다.
        장소 상세 화면에서 "기록 더 보기" 탭을 탭할 때 사용된다.
        GET /places/:placeId의 recent_logs는 최대 5개 미리보기이며,
        전체 기록이 필요한 경우 이 엔드포인트를 사용한다.
        비인증 요청도 허용된다.
      security: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitLogSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          description: 장소 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags: [VisitLog]
      summary: 여행 기록 작성
      description: |
        방문한 장소에 사진(여러 장 가능)과 한줄 리뷰를 기록한다.
        사진마다 먼저 POST /uploads/presigned-url로 S3에 직접 업로드한 뒤,
        반환된 file_url들을 photos 배열에 담아 요청해야 한다(순서 = 노출 순서, 2026-09-06 결정).
        사진마다 캡션을 같이 담을 수 있다(선택, 2026-09-07 결정, decision-log 참고).

        이 API 자체는 이 엔드포인트 호출 시점에 다음 두 가지만 동기로 처리한다.
          1. 여행 기록 생성 (사진 URL 목록, 제목, 한줄 리뷰, 날씨 저장)
          2. place.visit_log_count +1 (방문 로그 수 증가 → 숨은 장소 판단 기준값)

        업로드된 사진의 AI 감성 태그 자동 분석은 이 API와 별개로, AI 서버가 사진을 비동기(배치)로
        분석해서 log_emotion_tag에 직접 적재하는 방식으로 동작한다(2026-08-31 결정) — 즉 이 응답의
        tags는 방문 기록 작성 직후에는 아직 빈 배열일 수 있고, AI 분석이 끝나면 이후 GET 조회 시점에
        자동으로 채워진다(별도 API 재호출 불필요). 장소의 상위 태그(GET /places/:placeId의 top_tags)도
        저장된 카운터 없이 log_emotion_tag를 조회 시점에 직접 집계해서 계산하므로, AI가 태그를
        적재하는 즉시 반영된다(2026-09-02 결정, decision-log 참고).

        응답으로 VisitLogDetail 전체를 반환하므로, 클라이언트가 별도의 GET /logs/:logId 호출 없이
        작성 직후 화면을 바로 렌더링할 수 있다.
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        description: Presigned URL로 S3 업로드 완료 후 받은 file_url
                      caption:
                        type: string
                        maxLength: 100
                        description: 이 사진에 대한 글(선택). 2026-09-07 추가, decision-log 참고
                  maxItems: 10
                  description: 배열 순서대로 저장/노출됨(2026-09-06 추가). 사진별 캡션은 2026-09-07 추가(decision-log 참고)
                title:
                  type: string
                  nullable: true
                  maxLength: 50
                  description: 기록 제목
                one_line:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: 한줄 리뷰
                weather:
                  type: string
                  nullable: true
                  maxLength: 20
                  description: 날씨(자유 입력 텍스트)
                rating:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 5
                  description: 별점(1~5), 선택 입력
                visited_at:
                  type: string
                  format: date-time
                  description: 방문 날짜 및 시간
      responses:
        '201':
          description: 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitLogDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 장소 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logs/course:
    post:
      tags: [VisitLog]
      summary: 코스 단위 여행 기록 작성 (장소 2개 이상)
      description: |
        나의 일지 "기록하기"에서 장소를 2개 이상 골랐을 때 사용. course(source=journal) +
        장소마다 하나씩 VisitLog를 한 트랜잭션으로 생성하고, 생성된 모든 VisitLog가 같은
        course_id를 공유한다. 나의 일지 화면은 같은 course_id를 가진 기록들을 하나의 코스
        카드로 묶어서 보여준다. 장소가 1개뿐이면 이 엔드포인트 대신 기존
        POST /places/{placeId}/logs를 사용한다. (2026-09-08 결정, decision-log 참고)

        장소별 필드(photos/title/one_line/weather/rating/visited_at)는 개별
        POST /places/{placeId}/logs와 동일한 의미 — 코스 전체가 아니라 장소마다 각각 입력받는다.
        생성된 course는 GET /users/me/courses(스크랩북 "내 코스")에도 노출된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [places]
              properties:
                places:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items:
                    type: object
                    required: [place_id]
                    properties:
                      place_id:
                        type: integer
                        format: int64
                      photos:
                        type: array
                        maxItems: 10
                        items:
                          type: object
                          required: [url]
                          properties:
                            url:
                              type: string
                              description: Presigned URL로 S3 업로드 완료 후 받은 file_url
                            caption:
                              type: string
                              maxLength: 100
                      title:
                        type: string
                        nullable: true
                        maxLength: 50
                      one_line:
                        type: string
                        nullable: true
                        maxLength: 100
                      weather:
                        type: string
                        nullable: true
                        maxLength: 20
                      rating:
                        type: integer
                        nullable: true
                        minimum: 1
                        maximum: 5
                      visited_at:
                        type: string
                        format: date-time
                course_title:
                  type: string
                  nullable: true
                  maxLength: 200
                  description: 생략하면 "9월 8일의 코스"처럼 방문일 기준으로 자동 생성됨
      responses:
        '201':
          description: 작성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  course_id:
                    type: integer
                    format: int64
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/VisitLogDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 장소 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /swipe/candidates:
    post:
      tags: [Swipe]
      summary: 스와이프 후보 장소 요청
      description: |
        일정짜기 화면에서 사용자가 여행 날짜, 이동 수단, 분위기, 선호 카테고리를 입력하면
        서버가 사용자 취향에 맞는 장소 카드 목록을 반환한다.
        mood_tags를 비워두면 user_preference 상위 태그를 자동으로 사용하므로
        온보딩을 완료한 사용자는 별도 입력 없이도 개인화된 후보를 받을 수 있다.

        응답의 session_id는 이후 스와이프 결과 제출(POST /swipe/sessions/:sessionId/results)과
        코스 생성(POST /courses/generate)에 반드시 필요하다. 24시간 유효.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeCandidatesRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeCandidatesResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /swipe/sessions/{sessionId}:
    get:
      tags: [Swipe]
      summary: 스와이프 세션 재조회 (앱 복귀 시 복원)
      description: |
        앱이 백그라운드로 전환되었다가 복귀하거나, 스와이프 도중 앱을 껐다 켰을 때
        진행 중이던 세션 상태를 복원하기 위해 사용한다.
        잔여 후보 목록과 이미 스와이프한 결과를 함께 반환하므로,
        클라이언트는 이 데이터를 바탕으로 화면을 이전 상태로 복원할 수 있다.
        세션이 만료된 경우(24시간 초과) 410을 반환하며 새 세션을 시작해야 한다.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 세션 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwipeSessionDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 본인 세션이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 세션 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 세션 만료 (24시간 초과)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SESSION_EXPIRED
                message: 스와이프 세션이 만료되었습니다. 다시 시작해주세요.

  /swipe/sessions/{sessionId}/results:
    post:
      tags: [Swipe]
      summary: 스와이프 결과 제출
      description: |
        사용자가 카드를 모두 스와이프한 결과를 서버에 제출한다.
        제출된 결과는 두 가지 목적으로 활용된다.
          1. user_preference 점수 업데이트: like/must 장소의 태그는 점수를 올리고, skip은 약한 음수 반영
          2. 코스 생성 데이터: must 장소는 POST /courses/generate 시 반드시 코스에 포함됨

        세션 만료(24시간 초과) 후 요청 시 410을 반환하며, 이 경우 새로운 스와이프를 시작해야 한다.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwipeResultRequest'
      responses:
        '204':
          description: 제출 성공
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 세션 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 세션 만료 (24시간 초과)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SESSION_EXPIRED
                message: 스와이프 세션이 만료되었습니다. 다시 시작해주세요.

  /courses/generate:
    post:
      tags: [Course]
      summary: AI 코스 후보 생성
      description: |
        스와이프 결과를 바탕으로 최대 3개의 1일 여행 코스 후보를 생성한다.
        서버는 다음 요소를 종합하여 코스를 구성한다.
          - 사용자 취향 태그와 장소 속성 매칭
          - must 장소 반드시 포함
          - 방문 로그 수 기반 숨은 장소 비율 조절 (visit_log_count가 낮은 장소 우선 포함)
          - 구글맵 Directions API 경유지 최적화로 이동 거리 최소화 및 방문 순서 계산
          - 카테고리 균형 (관광지-식당-카페 등 적절히 배분)

        구글맵 API 응답 원본은 서버에 저장하지 않으며, 코스 저장(POST /courses) 시에도
        장소 목록과 방문 순서만 저장된다. 이동시간/거리 정보는 코스 조회 시 매번 재계산된다.

        세션 만료(24시간 초과) 후 요청 시 410을 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseGenerateRequest'
      responses:
        '200':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGenerateResponse'
        '400':
          description: >-
            좋아요/필수 표시한 장소가 부족(NOT_ENOUGH_SWIPE_CANDIDATES) 또는
            end_time이 start_time보다 이르거나 같음(INVALID_COURSE_TIME_RANGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 세션 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 세션 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: SESSION_EXPIRED
                message: 스와이프 세션이 만료되었습니다. 다시 시작해주세요.

  /courses:
    post:
      tags: [Course]
      summary: 코스 저장
      description: |
        생성된 코스 후보 중 마음에 드는 코스를 저장한다.
        장소 목록과 방문 순서만 저장하며 구글맵 이동시간/거리 원본은 저장하지 않는다.
        저장된 코스를 다시 열 때마다 구글맵 API를 재호출하여 최신 경로 정보를 제공한다.
        travel_date가 지정된 경우 해당 날짜 당일 아침에 course_reminder 알림이 발송된다 (알림 설정이 켜진 경우).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseSaveRequest'
      responses:
        '201':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSaveResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses/manual:
    post:
      tags: [Course]
      summary: 직접 코스 짜기 (좋아요 목록 기반)
      description: |
        AI 스와이프 방식이 아닌 사용자가 직접 좋아요한 장소를 골라 코스를 구성하는 방식.
        두 가지 코스 생성 진입점 중 하나.

        AI 코스 짜기 vs 직접 코스 짜기:
          - AI: 스와이프 → AI가 조건 고려해서 자동 생성 → 후보 3개 선택
          - 직접: 좋아요 목록에서 원하는 장소 선택 → 순서 직접 배치 → 저장

        직접 코스의 경우 source=user로 저장되며,
        구글맵 경로 계산은 GET /courses/:courseId 조회 시 동일하게 재계산됨.

        여러 날 범위 지원(2026-09-06 추가, decision-log 참고): end_date를 같이 보내면 여행
        기간(travel_date~end_date)으로 저장·표시됨. AI 코스 짜기(POST /courses/generate)는
        이 필드를 지원하지 않음(course_optimizer가 단일 날짜 전제). end_date가 travel_date보다
        이전이면 400(INVALID_COURSE_DATE_RANGE).

        여러 날 코스의 장소별 날짜 배정(2026-09-06 추가, decision-log 참고): 장소마다
        visit_date를 같이 보내면 그 장소가 코스의 며칠째 방문지인지 저장됨(N박N일 여러 날
        코스). visit_date가 travel_date~end_date 범위를 벗어나면 400(INVALID_COURSE_DATE_RANGE).
        visit_order는 날짜와 무관하게 코스 전체를 통틀은 전역 순서(하루짜리 코스면 날짜
        구분 없이 기존과 동일하게 동작 — visit_date를 안 보내도 됨).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, places]
              properties:
                title:
                  type: string
                  maxLength: 200
                  example: 내가 고른 안동 하루 코스
                travel_date:
                  type: string
                  format: date
                  nullable: true
                  example: '2025-11-10'
                end_date:
                  type: string
                  format: date
                  nullable: true
                  description: 여러 날 범위 지원. travel_date(시작일)보다 이전이면 400.
                  example: '2025-11-12'
                transport:
                  type: string
                  enum: [car, walk, public]
                  example: car
                places:
                  type: array
                  description: 사용자가 직접 선택하고 순서를 배치한 장소 목록
                  items:
                    type: object
                    required: [place_id, visit_order]
                    properties:
                      place_id:
                        type: integer
                        format: int64
                        example: 1
                      visit_order:
                        type: integer
                        example: 1
                      planned_time:
                        type: string
                        nullable: true
                        example: '10:00'
                      visit_date:
                        type: string
                        format: date
                        nullable: true
                        description: 이 장소가 며칠째 방문지인지. travel_date~end_date 범위를 벗어나면 400
                        example: '2025-11-10'
      responses:
        '201':
          description: 코스 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSaveResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /courses/{courseId}:
    get:
      tags: [Course]
      summary: 코스 상세 조회 (경로 재계산)
      description: |
        저장된 코스의 상세 정보를 반환한다.
        호출 시마다 저장된 장소 목록을 기준으로 구글맵 API를 재호출하여
        최신 이동 시간, 이동 거리, 폴리라인을 계산하여 포함한다.
        이를 통해 도로 상황 변경이나 장소 이전에도 항상 최신 경로 정보를 제공할 수 있다.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 본인 코스가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 코스 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Course]
      summary: 코스 수정
      description: |
        저장된 코스의 제목 또는 장소 구성을 수정한다.
        places 배열을 전체 교체하는 방식으로 동작하므로, 장소 1개를 빼더라도 나머지 전체를 포함하여 전달해야 한다.
        수정 시 source는 ai_edited 또는 user로만 변경 가능하며 ai로 되돌릴 수 없다.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 본인 코스가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 코스 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Course]
      summary: 코스 삭제
      description: |
        저장된 코스를 삭제한다. 연관된 course_place 레코드도 CASCADE로 함께 삭제된다.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 본인 코스가 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 코스 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /logs/{logId}:
    get:
      tags: [VisitLog]
      summary: 여행 기록 단건 조회
      description: |
        여행 기록 상세 화면에서 사용된다.
        개인 로그 지도에서 핀을 탭하거나 기록 목록에서 항목을 선택할 때 호출된다.
        본인 기록만 조회 가능하다.
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitLogDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 본인 기록이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 기록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [VisitLog]
      summary: 여행 기록 수정
      description: |
        여행 기록의 한줄 리뷰 또는 방문 날짜를 수정한다.
        사진은 수정 불가능하다. 사진을 바꾸고 싶은 경우 기록을 삭제 후 재작성해야 한다.
        AI가 분석하여 자동 부여한 감성 태그도 수정할 수 없다.
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitLogUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitLogDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 본인 기록이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 기록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [VisitLog]
      summary: 여행 기록 삭제
      description: |
        여행 기록을 삭제한다.
        삭제 시 place.visit_log_count를 -1 처리한다. 이 기록에 달려있던 log_emotion_tag 행도
        DB FK(ON DELETE CASCADE)로 함께 삭제되며, 장소의 상위 태그는 조회 시점에 log_emotion_tag를
        직접 집계하므로(저장된 카운터 없음, 2026-09-02 결정) 별도 차감 처리 없이 자동으로 반영된다.
      parameters:
        - name: logId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 본인 기록이 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 기록 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /explore/similar-logs:
    get:
      tags: [Explore]
      summary: 유사 사용자 공개 기록 탐색 (지도용)
      description: |
        내 user_preference 상위 태그와 유사한 취향을 가진 다른 사용자의 공개 여행 기록을 반환한다.
        지도 화면에서 "유사 취향 여행자 기록 보기" 탭을 활성화할 때 사용된다.
        추천 점수 계산에는 반영하지 않으며, 취향 기반 실제 경험 데이터를 탐색하는 참고 콘텐츠로만 제공된다.
        bounds 파라미터로 현재 지도 뷰포트 내 기록만 필터링하여 핀으로 표시한다.
      parameters:
        - name: bounds
          in: query
          description: 지도 뷰포트 좌표 sw_lat,sw_lng,ne_lat,ne_lng
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimilarLogItem'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /explore/similar-courses:
    get:
      tags: [Explore]
      summary: 유사 사용자 공개 코스 탐색 ("취향 맞춤 코스" 탭)
      description: |
        내 user_preference 상위 태그와 유사한 취향을 가진 다른 사용자의 공개 코스를 반환한다
        (2026-09-07 결정, decision-log 참고). similar-logs와 동일한 취향 겹침 판단(상위 태그
        3개, 유사도 0.6 이상)을 코스에도 그대로 적용한다.
        카드 목록용 가벼운 응답이라 장소 좌표/전체 경로는 포함하지 않는다 — "선택" 시
        GET /explore/courses/{courseId}로 상세(좌표+경로)를 따로 조회해야 한다.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimilarCourseItem'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /explore/courses/{courseId}:
    get:
      tags: [Explore]
      summary: 공개 코스 상세 조회 ("취향 맞춤 코스" 탭 "자세히 보기")
      description: |
        GET /courses/{courseId}와 응답 형태는 동일(CourseDetail, 경로 재계산 포함)하지만
        소유자 확인 대신 공개 여부(is_public)만 확인한다 — 로그인만 돼 있으면 다른 사용자의
        공개 코스도 조회할 수 있다(2026-09-07 결정, decision-log 참고).
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 공개되지 않은 코스
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 코스 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /uploads/presigned-url:
    post:
      tags: [Upload]
      summary: S3 직접 업로드용 Presigned URL 발급
      description: |
        사진을 서버를 경유하지 않고 S3에 직접 업로드하기 위한 Presigned PUT URL을 발급한다.
        서버 경유 업로드는 서버 트래픽과 처리 비용이 크므로 이 방식을 사용한다.

        업로드 흐름:
          1. POST /uploads/presigned-url 호출 → upload_url, file_url 수신
          2. 클라이언트가 upload_url로 HTTP PUT 요청 (바이너리 파일 직접 전송)
          3. 업로드 완료 후 file_url을 photos[].url 또는 profile_image_url로 사용

        upload_url은 10분간 유효하며 만료 후에는 재발급이 필요하다.
        purpose 값에 따라 S3 저장 경로가 분기된다 (visit_logs/ 또는 profiles/).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignedUrlRequest'
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrlResponse'
        '400':
          description: 지원하지 않는 파일 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /images/proxy:
    get:
      tags: [Image]
      summary: Google Places 사진 프록시
      description: |
        Google Places Photo API 사진을 서버가 대신 요청해 중계한다.
        Google Photo API는 URL 자체에 API 키(key=...)가 필요해서, 이 키를 그대로 DB/앱에 노출하지 않기 위한 용도다.

        `place_image.img_url`에는 Google 원본 URL 대신 이 프록시 엔드포인트 URL(ref=photo_reference 포함)을 저장한다.
        앱은 별도 인증 없이 이 URL을 `<Image>` 컴포넌트의 소스로 바로 사용하면 된다.
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: string
          description: Google Places API의 photo_reference 값
        - name: maxWidth
          in: query
          required: false
          schema:
            type: integer
            default: 800
            minimum: 100
            maximum: 1600
      responses:
        '200':
          description: 이미지 바이너리 (Content-Type은 Google 응답 기준)
          content:
            image/*:
              schema:
                type: string
                format: binary
        '400':
          description: photo_reference 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Google Places API 요청 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /events:
    get:
      tags: [Event]
      summary: 행사 및 축제 일정 목록 조회
      description: |
        월별 행사 및 축제 목록을 반환한다.
        캘린더형 UI에서 이번 달 전체 일정을 한 번에 조회할 때 사용된다.
        장소 목록(GET /places?category=축제행사)의 travel_date 필터와 달리
        특정 날짜가 아닌 한 달 전체의 행사를 조회하는 데 적합하다.
        d_day 필드로 시작까지 남은 일수를 표시하며, 진행 중은 0, 종료 후는 -1로 반환된다.
      security: []
      parameters:
        - name: month
          in: query
          description: 조회 월 (YYYY-MM). 없으면 현재 월 기준으로 반환.
          schema:
            type: string
            example: '2025-11'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventListItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /admin/sync/places:
    post:
      tags: [Admin]
      summary: 관광공사 OpenAPI 장소 데이터 동기화 트리거
      description: |
        한국관광공사 국문 관광정보 서비스 OpenAPI를 호출하여 안동 지역 장소 데이터를 DB에 동기화한다.
        신규 장소는 INSERT, 기존 장소(contentId 기준)는 UPDATE, 삭제된 장소는 비활성화 처리한다.
        배치 스케줄러(예: 매일 새벽)에서 자동으로 호출하거나, 수동으로 즉시 동기화할 때 사용한다.
        내부 관리용 엔드포인트로 별도의 Admin 인증키(X-Admin-Key 헤더)가 필요하다.
      security: []
      parameters:
        - name: X-Admin-Key
          in: header
          required: true
          description: 관리자 전용 인증키
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                area_code:
                  type: string
                  description: '동기화할 지역 코드. 기본값은 안동(35)'
                  default: '35'
                force_all:
                  type: boolean
                  description: true이면 변경 여부와 관계없이 전체 재동기화. false이면 최근 업데이트 분만 처리.
                  default: false
      responses:
        '200':
          description: 동기화 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
                    description: 신규 추가된 장소 수
                    example: 12
                  updated:
                    type: integer
                    description: 업데이트된 장소 수
                    example: 34
                  deactivated:
                    type: integer
                    description: 비활성화된 장소 수
                    example: 2
                  duration_ms:
                    type: integer
                    description: 동기화 소요 시간 (밀리초)
                    example: 4200
        '401':
          description: 유효하지 않은 Admin Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags: [System]
      summary: 헬스체크
      description: |
        서버 가동 상태를 확인한다.
        배포 파이프라인의 헬스 체크, 로드 밸런서 상태 확인, 모니터링 시스템 연동에 사용된다.
        인증 없이 호출 가능하며 항상 빠르게 응답해야 한다.
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 1.2.0
                  timestamp:
                    type: string
                    format: date-time
