[project]
name = "hidden-score"
version = "1.0.0"
description = "동글 AI 모듈 (hidden_score, semantic_vector, course_optimizer)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.40.0",
    "qdrant-client>=1.10.0",
    "langsmith>=0.3.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hidden_score*", "semantic_vector*", "course_optimizer*", "place_recommender*", "api*"]

[tool.pytest.ini_options]
testpaths = ["hidden_score/tests", "semantic_vector/tests", "course_optimizer/tests", "place_recommender/tests", "api/tests"]
pythonpath = ["."]
